<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variedades Donde Juve — Facturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F6F1E2;
    --crate:#8A5A2E;
    --crate-dark:#6B4322;
    --green:#2E5D3A;
    --green-dark:#1E3F27;
    --tomato:#C1440E;
    --mustard:#E4A83A;
    --ink:#211D16;
    --ink-soft:#5B5346;
    --line:#DDD2B8;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(90deg, #B8804A 0px, #B8804A 2px, #A9713E 2px, #A9713E 60px),
      #A9713E;
    min-height:100vh;
    padding:18px 12px 60px;
  }
  .sheet{
    max-width:720px;
    margin:0 auto;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    overflow:hidden;
    border:1px solid var(--line);
  }

  /* ---- Header / logo ---- */
  .marquee{
    background:var(--green);
    background-image:
      radial-gradient(circle at 12% 30%, rgba(255,255,255,0.06) 0, transparent 40%),
      radial-gradient(circle at 88% 70%, rgba(0,0,0,0.12) 0, transparent 45%);
    padding:26px 20px 22px;
    text-align:center;
    position:relative;
    border-bottom:6px solid var(--mustard);
  }
  .marquee::before, .marquee::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:10px;
    background:repeating-linear-gradient(180deg, var(--mustard) 0 14px, var(--green-dark) 14px 28px);
  }
  .marquee::before{ left:0; }
  .marquee::after{ right:0; }
  .brand-title{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(28px, 7vw, 40px);
    color:var(--white);
    margin:0;
    letter-spacing:0.3px;
    line-height:1.05;
  }
  .brand-sub{
    font-family:'Fredoka',sans-serif;
    font-weight:500;
    color:var(--mustard);
    margin:6px 0 0;
    font-size:14px;
    letter-spacing:1px;
  }
  .brand-icons{ font-size:20px; letter-spacing:6px; margin-top:8px; opacity:0.9;}

  /* ---- Body ---- */
  .body{ padding:22px 20px 8px; }

  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 16px;
    margin-bottom:22px;
  }
  .field-grid .full{ grid-column:1 / -1; }
  label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:600;
  }
  input[type=text], input[type=date], input[type=number]{
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:var(--white);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
  }
  .field-grid input{ width:100%; }
  input:focus{ outline:2px solid var(--green); outline-offset:1px; border-color:var(--green); }

  /* ---- Table ---- */
  .table-wrap{ margin-bottom:14px; }

  .items-head{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:700;
    padding:0 4px 6px;
    border-bottom:2px solid var(--green);
  }
  .items-head .h-articulo{ flex:1 1 90px; }
  .items-head .h-cantidad{ width:64px; }
  .items-head .h-unidad{ width:72px; }
  .items-head .h-precio{ width:110px; text-align:right; }
  .items-head .h-del{ width:24px; }

  .item-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
  }
  .item-row input, .item-row select{
    padding:6px 8px;
    font-size:13.5px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--white);
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .item-row input[data-field="articulo"]{
    flex:0 1 auto;
    min-width:7ch;
    max-width:100%;
  }
  .item-row input[data-field="cantidad"]{ width:64px; flex:0 0 auto; }
  .item-row select[data-field="unidad"]{ width:72px; flex:0 0 auto; padding:6px 4px; }
  .item-row input[data-field="precio"]{ width:110px; flex:0 0 auto; text-align:right; font-weight:600; }
  .del-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--tomato);
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    line-height:1;
    padding:4px 6px;
    border-radius:4px;
  }
  .del-btn:hover{ background:rgba(193,68,14,0.12); }
  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:18px 0;
    font-style:italic;
  }

  .add-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:var(--green);
    color:var(--white);
    border:none;
    padding:10px 16px;
    border-radius:5px;
    font-size:14px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin:8px 0 24px;
  }
  .add-btn:hover{ background:var(--green-dark); }
  .add-btn:active{ transform:translateY(1px); }

  /* ---- Total ---- */
  .total-row{
    display:flex;
    justify-content:flex-end;
    align-items:baseline;
    gap:10px;
    border-top:2.5px solid var(--ink);
    padding-top:14px;
    margin-top:4px;
  }
  .total-label{
    font-size:14px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .total-value{
    font-family:'Fredoka',sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--tomato);
  }

  /* ---- Stamp / seal ---- */
  .stamp-zone{
    display:flex;
    justify-content:flex-end;
    padding:26px 22px 30px;
  }
  .stamp{
    width:172px;
    height:172px;
    border:4px solid var(--tomato);
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--tomato);
    transform:rotate(-9deg);
    position:relative;
    opacity:0.92;
    mix-blend-mode:multiply;
  }
  .stamp::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1.5px solid var(--tomato);
    border-radius:50%;
  }
  .stamp-brand{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:13px;
    line-height:1.15;
    padding:0 14px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .stamp-sub{
    font-size:9px;
    letter-spacing:1.5px;
    margin-top:4px;
    text-transform:uppercase;
  }
  .stamp-date{
    font-size:11.5px;
    font-weight:700;
    margin-top:6px;
    border-top:1.5px solid var(--tomato);
    padding-top:4px;
    width:70%;
  }

  /* ---- Action button ---- */
  .actions{
    max-width:720px;
    margin:14px auto 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .send-btn{
    background:var(--mustard);
    color:var(--ink);
    border:none;
    padding:12px 24px;
    border-radius:6px;
    font-weight:700;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .send-btn:hover{ filter:brightness(0.96); }
  .send-btn:disabled{ opacity:0.6; cursor:wait; }
  .send-note{
    font-size:12px;
    color:#fff;
    background:rgba(0,0,0,0.35);
    padding:6px 12px;
    border-radius:5px;
    max-width:480px;
    text-align:center;
  }

  /* ---- Mode used while rendering the PDF: hide controls, flatten inputs ---- */
  .pdf-mode .actions{ display:none; }
  .pdf-mode .del-btn{ display:none; }
  .pdf-mode .add-btn{ display:none; }
  .pdf-mode input, .pdf-mode select{
    border:none !important;
    background:transparent !important;
    padding:2px 4px !important;
  }
  .pdf-mode{ padding:0 !important; background:var(--white) !important; }
  .pdf-mode .sheet{ box-shadow:none !important; border:none !important; }

  @media (max-width:480px){
    .items-head{ display:none; }
    .item-row{ background:var(--white); border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
    .item-row input[data-field="articulo"]{ flex:1 1 100%; max-width:100%; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="marquee">
    <div class="brand-icons">🥬 🍅 🍇</div>
    <h1 class="brand-title">Variedades Donde Juve</h1>
    <p class="brand-sub">VERDURAS · FRUTAS FRESCAS · ABARROTES</p>
  </div>

  <div class="body">
    <div class="field-grid">
      <div>
        <label for="vendedor">Nombre del vendedor</label>
        <input type="text" id="vendedor" placeholder="Ej. Juan Pérez">
      </div>
      <div>
        <label for="cliente">Nombre del cliente</label>
        <input type="text" id="cliente" placeholder="Ej. María López">
      </div>
      <div class="full">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
    </div>

    <div class="table-wrap">
      <div class="items-head">
        <span class="h-articulo">Artículo</span>
        <span class="h-cantidad"></span>
        <span class="h-unidad"></span>
        <span class="h-precio">Precio</span>
        <span class="h-del"></span>
      </div>
      <div id="rows"></div>
      <div id="emptyNote" class="empty-note">Aún no has agregado artículos.</div>
    </div>

    <button class="add-btn" id="addBtn">＋ Agregar artículo</button>

    <div class="total-row">
      <span class="total-label">Total a pagar</span>
      <span class="total-value" id="totalValue">$0</span>
    </div>
  </div>

  <div class="stamp-zone">
    <div class="stamp">
      <div class="stamp-brand">Variedades<br>Donde Juve</div>
      <div class="stamp-sub">Factura emitida</div>
      <div class="stamp-date" id="stampDate">--/--/----</div>
    </div>
  </div>
</div>

<div class="actions">
  <button class="send-btn" id="sendBtn">📄 Ver factura en PDF</button>
</div>

<script>
(function(){
  const rowsEl = document.getElementById('rows');
  const emptyNote = document.getElementById('emptyNote');
  const addBtn = document.getElementById('addBtn');
  const totalValue = document.getElementById('totalValue');
  const fechaInput = document.getElementById('fecha');
  const stampDate = document.getElementById('stampDate');
  const sendBtn = document.getElementById('sendBtn');

  let items = [];
  let counter = 0;

  const todayISO = new Date().toISOString().slice(0,10);
  fechaInput.value = todayISO;

  // Formatea como pesos colombianos: separador de miles, sin decimales, sin "COP"
  function formatMoney(n){
    if (isNaN(n)) n = 0;
    const rounded = Math.round(n);
    return '$' + rounded.toLocaleString('es-CO');
  }

  function formatDateDisplay(iso){
    if(!iso) return '--/--/----';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function updateStampDate(){
    stampDate.textContent = formatDateDisplay(fechaInput.value);
  }
  fechaInput.addEventListener('input', updateStampDate);
  updateStampDate();

  function addItem(){
    counter++;
    items.push({ id: counter, articulo:'', cantidad:'', unidad:'kg', precio:'' });
    render();
  }

  function removeItem(id){
    items = items.filter(it => it.id !== id);
    render();
  }

  function updateItem(id, field, value){
    const it = items.find(i => i.id === id);
    if(it){ it[field] = value; }
    computeTotal();
  }

  function lineTotal(it){
    return parseFloat(it.precio) || 0;
  }

  function computeTotal(){
    const total = items.reduce((sum, it) => sum + lineTotal(it), 0);
    totalValue.textContent = formatMoney(total);
  }

  // El cuadro de artículo crece según lo que se escribe (usa unidades "ch")
  function autoGrow(inputEl){
    const len = inputEl.value.length;
    inputEl.style.width = Math.max(7, len + 2) + 'ch';
  }

  function render(){
    rowsEl.innerHTML = '';
    emptyNote.style.display = items.length ? 'none' : 'block';

    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `
        <input type="text" placeholder="Ej. Tomate" value="${it.articulo}" data-field="articulo">
        <input type="number" min="0" step="1" placeholder="Cant." value="${it.cantidad}" data-field="cantidad">
        <select data-field="unidad">
          <option value="kg" ${it.unidad==='kg'?'selected':''}>Kg</option>
          <option value="unidad" ${it.unidad==='unidad'?'selected':''}>Unidad</option>
        </select>
        <input type="number" min="0" step="1" placeholder="Precio" value="${it.precio}" data-field="precio">
        <button class="del-btn" title="Eliminar artículo" aria-label="Eliminar artículo">✕</button>
      `;

      const articuloInput = row.querySelector('[data-field="articulo"]');
      autoGrow(articuloInput);
      articuloInput.addEventListener('input', () => autoGrow(articuloInput));

      row.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('input', e => updateItem(it.id, el.dataset.field, e.target.value));
        el.addEventListener('change', e => updateItem(it.id, el.dataset.field, e.target.value));
      });
      row.querySelector('.del-btn').addEventListener('click', () => removeItem(it.id));

      rowsEl.appendChild(row);
    });

    computeTotal();
  }

  addBtn.addEventListener('click', addItem);

  // Genera el PDF de la factura y lo abre en una pestaña nueva para verlo (vista previa)
  async function generarYEnviar(){
    // Abrimos la pestaña YA, en el mismo clic, para que el navegador no la bloquee
    const previewWindow = window.open('', '_blank');

    sendBtn.disabled = true;
    const textoOriginal = sendBtn.textContent;
    sendBtn.textContent = 'Generando PDF...';

    try{
      document.body.classList.add('pdf-mode');
      const sheet = document.querySelector('.sheet');
      const canvas = await html2canvas(sheet, {
        scale: 2,
        backgroundColor: '#FFFDF8',
        useCORS: true,
        allowTaint: true
      });
      document.body.classList.remove('pdf-mode');

      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const imgHeight = (canvas.height * pageWidth) / canvas.width;
      pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, imgHeight);

      const nombreCliente = (document.getElementById('cliente').value || 'cliente').trim().replace(/\s+/g,'_');
      const fileName = `Factura_VariedadesDondeJuve_${nombreCliente}_${fechaInput.value || 'sinfecha'}.pdf`;
      const blob = pdf.output('blob');
      const url = URL.createObjectURL(blob);

      if (previewWindow) {
        previewWindow.location.href = url;
      } else {
        // El navegador bloqueó la pestaña nueva: mostramos el PDF en esta misma pestaña
        window.location.href = url;
      }
    } catch(err){
      document.body.classList.remove('pdf-mode');
      if (previewWindow) previewWindow.close();
      alert('No se pudo generar el PDF. Intenta de nuevo.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = textoOriginal;
    }
  }

  sendBtn.addEventListener('click', generarYEnviar);

  // Empieza con un artículo de ejemplo vacío para guiar al usuario
  addItem();
})();
</script>

</body>
</html>
